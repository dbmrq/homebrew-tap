name: update poppy-ai

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the formula from PyPI
        id: update
        run: |
          OUTPUT=$(python3 scripts/update_formula.py Formula/poppy-ai.rb poppy-ai)
          echo "$OUTPUT"
          echo "$OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          VERSION=$(echo "$OUTPUT" | sed -n 's/^updated [^ ]* -> \([^ ]*\)$/\1/p')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Commit and push if it changed
        if: ${{ steps.update.outputs.version != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/poppy-ai.rb
          git commit -m "Update poppy-ai to ${{ steps.update.outputs.version }}"
          git push
